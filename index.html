<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily SEAMO Math Problem</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <div class="card">
    <div class="header">
      <span id="date-display">--</span>
      <span id="topic-badge">SEAMO Grade 7</span>
    </div>

    <h1 id="question-text">Loading daily problem...</h1>

    <div class="interactive-section">
      <button id="hint-btn" onclick="toggleHint()">Show Hint</button>
      <div id="hint-box" class="hidden"></div>

      <div class="answer-box">
        <input type="text" id="user-answer" placeholder="Enter your answer">
        <button id="submit-btn" onclick="checkAnswer()">Submit</button>
      </div>

      <p id="feedback"></p>

      <button id="solution-btn" class="hidden" onclick="toggleSolution()">View Full Solution</button>
      <div id="solution-box" class="hidden"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
